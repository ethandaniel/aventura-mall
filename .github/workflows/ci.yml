name: Build verify and host website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: "/aventura-mall"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js static website
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile visitor flows
        run: npm run test:e2e
      - name: Save built website
        uses: actions/upload-artifact@v4
        with:
          name: aventura-mall-static
          path: out/
          if-no-files-found: error
      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/
      - name: Save resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: package-lock.json
          if-no-files-found: error
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report live URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf 'Site URL %s\n' "$SITE_URL"
